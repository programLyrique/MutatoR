# mutator's own mutation-testing CI. It exercises the reusable workflow
# (mutation-testing.yaml) on this package on every push/PR, so the workflow is
# continuously validated on a real R package before it is tagged for release.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: mutation-score.yaml

jobs:
  mutation-score:
    permissions:
      contents: write
    uses: ./.github/workflows/mutation-testing.yaml
    with:
      # mutator is the package under test here, so the checkout provides it and
      # nothing is installed from CRAN, r-universe or GitHub.
      mutator-source: local
      target-margin: "0.10"
      isolate: true
      # Exact file-level coverage attribution (no helper-file fallback), so each
      # mutant runs only the test file(s) that cover it.
      coverage-backend: per_file
      deploy-badge: true
      artifact-name: mutation-score
